[project]
name = "multiagent-backend"
version = "0.4.1"
description = "Backend MVP for a multi-agent review ingestion and knowledge base system"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "sqlalchemy>=2.0.30",
  "pydantic>=2.8.0",
  "psycopg[binary]>=3.2.0",
  "pgvector>=0.3.2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "httpx>=0.27.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
