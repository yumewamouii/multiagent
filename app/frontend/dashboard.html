<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/ui/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <div class="container py-4">
      <nav class="navbar navbar-expand-lg glass rounded-4 px-3 mb-4">
        <span class="navbar-brand fw-bold text-light">Dashboard</span>
        <div class="navbar-nav ms-auto gap-2">
          <a class="nav-link text-light" href="/">Главная</a>
          <a class="nav-link text-light" href="/dashboard">Дашборды</a>
          <a class="nav-link text-light" href="/queries">AI Запросы</a>
        </div>
      </nav>
      <section class="glass rounded-4 p-4 mb-3">
        <div class="row g-2 align-items-end">
          <div class="col-md-5"><label class="form-label">Название товара</label><input id="product" class="form-control" value="Чайник" /></div>
          <div class="col-md-3"><label class="form-label">Source ID</label><input id="source" type="number" class="form-control" /></div>
          <div class="col-md-4 d-flex gap-2"><button id="load" class="btn btn-primary w-100">Загрузить</button><button id="export" class="btn btn-outline-light w-100">Экспорт CSV</button></div>
        </div>
      </section>
      <div class="row g-3 mb-3">
        <div class="col-md-4"><div class="glass rounded-4 p-3"><small>Review Count</small><div id="review_count" class="kpi">-</div></div></div>
        <div class="col-md-4"><div class="glass rounded-4 p-3"><small>Avg Rating</small><div id="avg_rating" class="kpi">-</div></div></div>
        <div class="col-md-4"><div class="glass rounded-4 p-3"><small>Negative Ratio</small><div id="negative_ratio" class="kpi">-</div></div></div>
      </div>
      <section class="glass rounded-4 p-4 mb-3"><canvas id="sentimentChart" height="85"></canvas></section>
      <section class="glass rounded-4 p-4"><h5>Последние инсайты</h5><div class="table-responsive"><table class="table table-dark table-hover align-middle"><thead><tr><th>ID</th><th>Товар</th><th>Confidence</th><th>Дата</th><th>Summary</th></tr></thead><tbody id="rows"></tbody></table></div></section>
    </div>
    <script src="/ui/dashboard.js"></script>
  </body>
</html>
