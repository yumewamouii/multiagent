<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Queries</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/ui/styles.css" />
  </head>
  <body>
    <div class="container py-4">
      <nav class="navbar navbar-expand-lg glass rounded-4 px-3 mb-4">
        <span class="navbar-brand fw-bold text-light">AI Запросы</span>
        <div class="navbar-nav ms-auto gap-2">
          <a class="nav-link text-light" href="/">Главная</a>
          <a class="nav-link text-light" href="/dashboard">Дашборды</a>
          <a class="nav-link text-light" href="/queries">AI Запросы</a>
        </div>
      </nav>
      <section class="glass rounded-4 p-4 mb-3">
        <label class="form-label">Ваш вопрос</label>
        <textarea id="q" rows="3" class="form-control mb-2" placeholder="Введите вопрос по отзывам..."></textarea>
        <div class="row g-2">
          <div class="col-md-3"><input id="topk" type="number" value="5" class="form-control" /></div>
          <div class="col-md-9 d-flex gap-2"><button id="sync" class="btn btn-primary w-100">Синхронный запрос</button><button id="async" class="btn btn-outline-light w-100">Асинхронный запрос</button></div>
        </div>
      </section>
      <section class="glass rounded-4 p-4"><h5>Ответ</h5><pre id="out">Ожидание запроса...</pre></section>
    </div>
    <script src="/ui/queries.js"></script>
  </body>
</html>
